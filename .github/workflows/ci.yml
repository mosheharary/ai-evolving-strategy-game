name: CI

on:
  push:
    branches: [main]
  pull_request:

# Ordinary CI never needs live Google or TypeSafe credentials: AI runs in mock mode.
env:
  AI_MODE: mock
  DATABASE_URL: postgresql://echoes:echoes@localhost:5432/echoes
  REDIS_URL: redis://localhost:6379

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: echoes, POSTGRES_PASSWORD: echoes, POSTGRES_DB: echoes }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U echoes" --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.22.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (incl. determinism + AI failure tests)
        run: pnpm test
      - name: Migrate database
        run: pnpm db:migrate
      - name: Integration tests (API + PostgreSQL + Redis)
        run: pnpm test:integration
      - name: Build apps
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build all service images
        run: |
          for target in api worker web migrate; do
            docker buildx build --target "$target" --tag "echoes-$target:ci" --load .
          done
      - name: Boot the stack and run e2e
        run: |
          docker compose up --build -d
          for i in $(seq 1 60); do curl -sf http://localhost:3000/healthz && curl -sf http://localhost:4000/ready && break; sleep 3; done
          corepack enable && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
          ./scripts/verify-persistence.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
