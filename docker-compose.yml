name: echoes-of-the-frontier

# One command:  docker compose up --build   →   http://localhost:3000
# Works without any AI keys (mock mode). Put GOOGLE_API_KEY / TYPESAFE_API_KEY in .env for live AI.

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://echoes:echoes@postgres:5432/echoes
  REDIS_URL: redis://redis:6379
  ASSET_STORAGE_DIR: /data/assets
  ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
  TRUST_PROXY: "true"

x-ai-env-file: &ai-env-file
  - path: .env
    required: false

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: echoes
      POSTGRES_PASSWORD: echoes
      POSTGRES_DB: echoes
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echoes -d echoes"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "100"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # One-shot: apply Prisma migrations, then seed the demo campaign (idempotent).
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://echoes:echoes@postgres:5432/echoes
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    env_file: *ai-env-file
    environment:
      <<: *app-env
      API_PORT: "4000"
    volumes:
      - assets:/data/assets
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 5s
    stop_grace_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    env_file: *ai-env-file
    environment:
      <<: *app-env
      WORKER_HEALTH_PORT: "4100"
    volumes:
      - assets:/data/assets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 30
    stop_grace_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4000
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  assets:
